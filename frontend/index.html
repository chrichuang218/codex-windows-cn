<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Windows 中文助手</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100vh;
        background: #111516;
      }

      #root {
        color: #f2f5f3;
        font-family:
          "Segoe UI Variable Text",
          "Microsoft YaHei UI",
          "Microsoft YaHei",
          "Segoe UI",
          system-ui,
          sans-serif;
        line-height: 1.35;
      }

      .preboot-shell,
      .preboot-shell * {
        box-sizing: border-box;
      }

      .preboot-shell {
        display: grid;
        min-height: 100vh;
        padding: 22px 28px 18px;
        background: #111516;
      }

      .preboot-panel {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        min-height: 0;
      }

      .preboot-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        min-height: 30px;
      }

      .preboot-header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
      }

      .preboot-header p,
      .preboot-header span,
      .preboot-main p,
      .preboot-main span {
        margin: 0;
        color: #8a9693;
        font-size: 12px;
      }

      .preboot-header p {
        margin-top: 5px;
      }

      .preboot-header span {
        font-size: 11px;
        font-weight: 700;
      }

      .preboot-main span {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .preboot-divider {
        height: 1px;
        margin-top: 10px;
        background: rgba(231, 238, 236, 0.11);
      }

      .preboot-main {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        min-height: 0;
        text-align: center;
      }

      .preboot-main h2 {
        margin: 0;
        font-size: 15px;
      }

      .preboot-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(118, 220, 205, 0.55);
        border-radius: 10px;
        padding: 2px;
        background: rgba(118, 220, 205, 0.08);
        box-shadow: 0 10px 28px rgba(118, 220, 205, 0.14);
      }

      .preboot-mark img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 7px;
        object-fit: cover;
      }

      .preboot-track {
        width: min(360px, 70vw);
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .preboot-track div {
        width: 34%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #efbd63, #76dccd);
        animation: preboot-sweep 1.1s ease-in-out infinite;
      }

      .preboot-footer {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        min-height: 34px;
        border-top: 1px solid rgba(231, 238, 236, 0.11);
        padding-top: 10px;
        color: #6b7774;
        font-size: 11px;
      }

      @keyframes preboot-sweep {
        0% {
          margin-left: -36%;
        }

        100% {
          margin-left: 102%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="preboot-shell">
        <section class="preboot-panel">
          <header class="preboot-header">
            <div>
              <h1>Codex Windows 中文助手</h1>
              <p>中文安装更新助手</p>
            </div>
            <span>正在加载</span>
          </header>
          <div class="preboot-divider"></div>
          <section class="preboot-main">
            <div class="preboot-mark" aria-hidden="true">
              <img alt="" src="/chatgpt-mark.svg" />
            </div>
            <h2>正在启动 Codex Windows 中文助手</h2>
            <div class="preboot-track"><div></div></div>
            <span>准备中</span>
            <p>正在读取安装、版本和更新状态。</p>
          </section>
          <footer class="preboot-footer">官方 Microsoft Store 分发</footer>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
